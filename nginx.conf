server {
    listen 80;
    server_name localhost;

    # --- Static SPA ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # --- xAI Speech-to-Text proxy ---
    # The browser POSTs multipart media here (same-origin, no CORS). nginx injects
    # the Authorization header server-side so XAI_API_KEY never reaches the client.
    # ${XAI_API_KEY} is substituted at container start from the environment via the
    # nginx template/envsubst mechanism (see Dockerfile).
    location /api/stt {
        # Force runtime DNS resolution via Docker's embedded resolver (not 1.1.1.1).
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $xai_upstream "api.x.ai";

        proxy_pass https://$xai_upstream/v1/stt;
        proxy_http_version 1.1;
        proxy_set_header Host api.x.ai;
        proxy_set_header Authorization "Bearer ${XAI_API_KEY}";
        proxy_ssl_server_name on;

        # Stream large uploads (up to 500MB) instead of buffering to disk.
        client_max_body_size 550m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
